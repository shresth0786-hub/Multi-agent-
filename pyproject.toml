[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research"
version = "0.1.0"
description = "Stateful, event-driven multi-agent research & execution system (LangGraph + FastAPI + Docker + AWS + n8n)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<1",
    "langgraph-checkpoint-sqlite>=2,<3",
    "langchain>=0.2,<1",
    "langchain-core>=0.2,<1",
    "langchain-openai>=0.1,<1",
    "langchain-community>=0.2,<1",
    "langchain-text-splitters>=0.2,<1",
    "faiss-cpu>=1.8,<2",
    "tavily-python>=0.5,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "tiktoken>=0.7,<1",
    "openai>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["app*"] } }
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live: requires live API keys (OPENAI_API_KEY / TAVILY_API_KEY). Run with `pytest -m live`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_pdf.py" = ["E501"]